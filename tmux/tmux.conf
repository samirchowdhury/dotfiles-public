# Terminator-style splits with Option (no prefix). Default key bindings are kept.
# Requires WezTerm's left Option to send Alt (see wezterm/wezterm.lua).
bind -n M-e split-window -h -c "#{pane_current_path}"   # side by side
bind -n M-o split-window -v -c "#{pane_current_path}"   # stacked
bind -n M-w kill-pane                                   # close pane
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
